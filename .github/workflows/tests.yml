name: Trust contract regression tests
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
